<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JsonHub Editor</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#0f0f0f;
color:white;
padding:20px;
}

.card{
background:#1a1a1a;
border:1px solid #2a2a2a;
border-radius:24px;
padding:18px;
margin-bottom:15px;
}

input, textarea{
width:100%;
background:#111;
border:1px solid #333;
color:white;
padding:14px;
border-radius:16px;
outline:none;
font-size:14px;
margin-top:10px;
}

textarea{
height:140px;
resize:none;
}

button{
border:none;
outline:none;
background:white;
color:black;
padding:13px 18px;
border-radius:16px;
font-weight:600;
margin-top:12px;
cursor:pointer;
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.action{
flex:1;
min-width:100px;
}

.item{
background:#151515;
border:1px solid #2d2d2d;
padding:15px;
border-radius:20px;
margin-top:12px;
}

.item-title{
font-size:17px;
font-weight:600;
margin-bottom:8px;
}

.status{
margin-top:10px;
font-size:13px;
color:#bdbdbd;
}

.fab{
position:fixed;
right:20px;
bottom:20px;
width:65px;
height:65px;
border-radius:100%;
font-size:28px;
background:white;
color:black;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

</style>
</head>
<body>

<div class="card">

<div>GitHub Token</div>
<input type="password" id="token">

<div style="margin-top:15px;">GitHub Username</div>
<input type="text" id="owner">

<div style="margin-top:15px;">Repository</div>
<input type="text" id="repo">

<div style="margin-top:15px;">JSON File Path</div>
<input type="text" id="path" value="data.json">

<button onclick="loadJson()">Load JSON</button>

<div class="status" id="status">
✓ All Changes Saved
</div>

<div class="status" id="changes">
No Pending Changes
</div>

</div>

<div class="card">

<div>Raw JSON Editor</div>

<textarea id="editor"></textarea>

<div class="row">

<button class="action" onclick="formatJson()">
Format
</button>

<button class="action" onclick="saveDraft()">
Save Draft
</button>

<button class="action" onclick="commitChanges()">
Commit Changes
</button>

</div>

</div>

<div class="card">

<div style="font-size:18px;font-weight:600;">
Preview Items
</div>

<input
type="text"
id="search"
placeholder="Search items..."
oninput="renderItems()"
>

<div id="list"></div>

</div>

<div class="fab" onclick="addItem()">
+
</div>

<script>

let sha = "";

function setStatus(text){
document.getElementById("status").innerText = text;
}

function setChanges(state){

const changes = document.getElementById("changes");

if(state){
changes.innerText = "● Unsaved Changes";
changes.style.color = "#ff9800";
}else{
changes.innerText = "✓ All Changes Saved";
changes.style.color = "#4caf50";
}

}

function getApi(){

const owner = document.getElementById("owner").value;
const repo = document.getElementById("repo").value;
const path = document.getElementById("path").value;

return `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

}

async function loadJson(){

try{

setStatus("Loading JSON...");

const token = document.getElementById("token").value;

const response = await fetch(getApi(),{
headers:{
Authorization:`token ${token}`
}
});

const data = await response.json();

sha = data.sha;

const decoded = atob(data.content.replace(/\n/g,""));

document.getElementById("editor").value = decoded;

renderItems();

setStatus("JSON Loaded Successfully");

}catch(e){

setStatus("Error Loading JSON");
console.log(e);

}

}

function saveDraft(){

localStorage.setItem(
"json_draft",
document.getElementById("editor").value
);

setStatus("Draft Saved");
setChanges(true);

}

async function commitChanges(){

try{

setStatus("Saving JSON...");

const token = document.getElementById("token").value;

const content =
document.getElementById("editor").value;

const response = await fetch(getApi(),{

method:"PUT",

headers:{
Authorization:`token ${token}`,
"Content-Type":"application/json"
},

body:JSON.stringify({
message:"Updated JSON",
content:btoa(unescape(encodeURIComponent(content))),
sha:sha
})

});

const data = await response.json();

sha = data.content.sha;

setStatus("Changes Committed");
setChanges(false);

}catch(e){

setStatus("Save Failed");
console.log(e);

}

}

function formatJson(){

try{

const editor = document.getElementById("editor");

const obj = JSON.parse(editor.value);

editor.value = JSON.stringify(obj,null,2);

renderItems();

}catch(e){

alert("Invalid JSON");

}

}

function renderItems(){

const list = document.getElementById("list");

list.innerHTML = "";

try{

const arr =
JSON.parse(document.getElementById("editor").value);

const keyword =
document.getElementById("search").value.toLowerCase();

arr.forEach((item,index)=>{

if(keyword &&
!(JSON.stringify(item).toLowerCase().includes(keyword)))
return;

const div = document.createElement("div");

div.className = "item";

const title =
item.hero ||
item.hero_name ||  
item.name ||
item.title ||
`Item ${index+1}`;

const image =
item.image ||
item.image_url ||
"https://via.placeholder.com/70";

const subtitle =
item.upgradable_skin ||
item.skin_name ||
item.id ||
item.description ||
"No Description";

div.innerHTML = `

<div style="display:flex;align-items:center;gap:14px;">

<img
src="${image}"
onerror="this.src='https://via.placeholder.com/70';"
style="
width:70px;
height:70px;
border-radius:18px;
object-fit:cover;
border:1px solid #333;
">

<div>

<div class="item-title">
${title}
</div>

<div style="color:#bdbdbd;font-size:13px;">
${subtitle}
</div>

</div>

</div>

<div class="row">

<button class="action" onclick="editItem(${index})">
Edit
</button>

<button class="action" onclick="duplicateItem(${index})">
Duplicate
</button>

<button class="action" onclick="deleteItem(${index})">
Delete
</button>

</div>

`;

list.appendChild(div);

});

}catch(e){

console.log(e);

}

}

function duplicateItem(index){

try{

const arr =
JSON.parse(document.getElementById("editor").value);

const copy =
JSON.parse(JSON.stringify(arr[index]));

arr.splice(index+1,0,copy);

document.getElementById("editor").value =
JSON.stringify(arr,null,2);

renderItems();

setChanges(true);

}catch(e){

console.log(e);

}

}

function editItem(index){

try{

const arr =
JSON.parse(document.getElementById("editor").value);

const itemText =
JSON.stringify(arr[index],null,2);

const edited = prompt(
"Edit JSON Item",
itemText
);

if(edited === null) return;

arr[index] = JSON.parse(edited);

document.getElementById("editor").value =
JSON.stringify(arr,null,2);

renderItems();

setChanges(true);

setStatus("Item Updated");

}catch(e){

alert("Invalid JSON");

}

}

function deleteItem(index){

try{

const arr =
JSON.parse(document.getElementById("editor").value);

arr.splice(index,1);

document.getElementById("editor").value =
JSON.stringify(arr,null,2);

renderItems();

setChanges(true);

}catch(e){

console.log(e);

}

}

function addItem(){

try{

const arr =
JSON.parse(document.getElementById("editor").value || "[]");

arr.push({
hero:"New Hero",
upgradable_skin:"New Skin",
image:"",
script:""
});

document.getElementById("editor").value =
JSON.stringify(arr,null,2);

renderItems();

setChanges(true);

}catch(e){

console.log(e);

}

}

</script>

</body>
</html>
