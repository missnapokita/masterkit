<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Update Admin</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#090000,#210000,#000);
  color:white;
  padding:20px;
}
.box{
  max-width:430px;
  margin:auto;
  background:#160505;
  border:1px solid #8b0000;
  border-radius:20px;
  padding:20px;
  box-shadow:0 0 25px #5c0000;
}
h2{text-align:center;color:#ff3b3b}
input,textarea,select{
  width:100%;
  box-sizing:border-box;
  margin:8px 0;
  padding:13px;
  border-radius:12px;
  border:1px solid #700;
  background:#260000;
  color:white;
  outline:none;
}
textarea{height:100px}
button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:#d00000;
  color:white;
  font-weight:bold;
}
button:hover{background:#ff1a1a}
.logout{background:#333}
small{color:#ffb3b3}
</style>
</head>

<body>

<div class="box">
  <h2>MasterKit JSON Admin</h2>

  <div id="loginBox">
    <input id="owner" placeholder="GitHub Username / Owner">
    <input id="repo" placeholder="Repo name">
    <input id="branch" placeholder="Branch" value="main">
    <input id="filePath" placeholder="JSON file name" value="version.json">
    <input id="token" type="password" placeholder="GitHub Token">

    <button onclick="saveLogin()">SAVE LOGIN</button>
    <small>Token is saved only in this browser using localStorage.</small>
  </div>

  <div id="adminBox" style="display:none;">
    <input id="version_code" placeholder="Version Code">
    <input id="title" placeholder="Title">
    <textarea id="message" placeholder="Message"></textarea>
    <input id="update_url" placeholder="Update URL">

    <select id="force_update">
      <option value="false">Force Update: false</option>
      <option value="true">Force Update: true</option>
    </select>

    <button onclick="loadJson()">LOAD JSON</button>
    <button onclick="saveJson()">SAVE UPDATE</button>
    <button class="logout" onclick="logout()">LOGOUT / RESET TOKEN</button>
  </div>
</div>

<script>
let config = {};

window.onload = function(){
  const saved = localStorage.getItem("github_admin_login");
  if(saved){
    config = JSON.parse(saved);
    showAdmin();
    loadJson();
  }
};

function saveLogin(){
  config = {
    owner: document.getElementById("owner").value.trim(),
    repo: document.getElementById("repo").value.trim(),
    branch: document.getElementById("branch").value.trim(),
    filePath: document.getElementById("filePath").value.trim(),
    token: document.getElementById("token").value.trim()
  };

  if(!config.owner || !config.repo || !config.branch || !config.filePath || !config.token){
    alert("Pakilagyan lahat ng fields.");
    return;
  }

  localStorage.setItem("github_admin_login", JSON.stringify(config));
  showAdmin();
  loadJson();
}

function showAdmin(){
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("adminBox").style.display = "block";
}

function logout(){
  localStorage.removeItem("github_admin_login");
  location.reload();
}

async function loadJson(){
  try{
    const apiUrl = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.filePath}?ref=${config.branch}`;

    const res = await fetch(apiUrl, {
      headers:{
        "Authorization":"Bearer " + config.token,
        "Accept":"application/vnd.github+json"
      }
    });

    const file = await res.json();

    if(!res.ok){
      alert("Error loading JSON: " + file.message);
      return;
    }

    const jsonText = atob(file.content.replace(/\n/g, ""));
    const data = JSON.parse(jsonText);

    document.getElementById("version_code").value = data.version_code || "";
    document.getElementById("title").value = data.title || "";
    document.getElementById("message").value = data.message || "";
    document.getElementById("update_url").value = data.update_url || "";
    document.getElementById("force_update").value = String(data.force_update || false);

    localStorage.setItem("github_file_sha", file.sha);

  }catch(e){
    alert("Load failed: " + e.message);
  }
}

async function saveJson(){
  try{
    const sha = localStorage.getItem("github_file_sha");

    const newJson = {
      version_code: Number(document.getElementById("version_code").value),
      title: document.getElementById("title").value,
      message: document.getElementById("message").value,
      update_url: document.getElementById("update_url").value,
      force_update: document.getElementById("force_update").value === "true"
    };

    const content = btoa(unescape(encodeURIComponent(JSON.stringify(newJson, null, 2))));

    const apiUrl = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.filePath}`;

    const res = await fetch(apiUrl, {
      method:"PUT",
      headers:{
        "Authorization":"Bearer " + config.token,
        "Accept":"application/vnd.github+json",
        "Content-Type":"application/json"
      },
      body: JSON.stringify({
        message: "Update version.json from admin panel",
        content: content,
        sha: sha,
        branch: config.branch
      })
    });

    const result = await res.json();

    if(!res.ok){
      alert("Save error: " + result.message);
      return;
    }

    localStorage.setItem("github_file_sha", result.content.sha);
    alert("JSON updated successfully!");

  }catch(e){
    alert("Save failed: " + e.message);
  }
}
</script>

</body>
</html>
