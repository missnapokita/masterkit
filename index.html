<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update lamet hays!</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#101010;
  font-family:Arial, sans-serif;
  color:#fff;
}
.wrapper{
  max-width:720px;
  margin:auto;
  padding:16px;
}
.logoBox{
  background:#292929;
  border-radius:4px;
  padding:55px 20px;
  text-align:center;
  margin-bottom:32px;
}
.logo{
  font-size:44px;
  letter-spacing:22px;
  font-weight:500;
}
.logo span{
  color:#ff3333;
}
.play{
  color:#ff3333;
  font-size:52px;
  vertical-align:middle;
  margin-right:18px;
}
.title{
  font-size:28px;
  margin:0 0 24px 16px;
}
.card{
  background:#242424;
  padding:16px;
  border-radius:4px;
  margin-bottom:12px;
}
input,textarea,select{
  width:100%;
  background:#242424;
  border:2px solid #151515;
  border-radius:7px;
  padding:16px;
  color:white;
  font-size:16px;
  margin-bottom:12px;
  outline:none;
}
textarea{
  height:110px;
  resize:none;
}
input::placeholder,textarea::placeholder{
  color:#777;
}
button{
  width:100%;
  background:#111;
  border:none;
  border-radius:16px;
  padding:17px;
  color:white;
  font-size:16px;
  letter-spacing:3px;
  font-weight:bold;
  margin-top:8px;
}
button:active{
  background:#ff3333;
}
.redBtn{
  background:#ff3333;
}
.logout{
  background:#333;
}
small{
  color:#aaa;
  display:block;
  margin-top:10px;
  text-align:center;
}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="logoBox">
    <div class="logo">
      <span class="play">▶</span>MOVIE<span>+</span>
    </div>
  </div>

  <h2 class="title">JSON Update Admin</h2>

  <div class="card" id="loginBox">
    <input id="owner" placeholder="GitHub Owner / Username">
    <input id="repo" placeholder="Repository Name">

    <div class="row">
      <input id="branch" placeholder="Branch" value="main">
      <input id="filePath" placeholder="JSON Name" value="version.json">
    </div>

    <input id="token" type="password" placeholder="GitHub Token">

    <button onclick="saveLogin()">LOGIN</button>
    <small>One-time login. Token will be saved in this browser only.</small>
  </div>

  <div class="card" id="adminBox" style="display:none;">
    <div class="row">
      <input id="version_code" placeholder="Version Code">
      <select id="force_update">
        <option value="false">Force: false</option>
        <option value="true">Force: true</option>
      </select>
    </div>

    <input id="title" placeholder="Update Title">
    <textarea id="message" placeholder="Update Message"></textarea>
    <input id="update_url" placeholder="Download / Update URL">

    <button onclick="loadJson()">LOAD JSON</button>
    <button class="redBtn" onclick="saveJson()">SAVE UPDATE</button>
    <button class="logout" onclick="logout()">LOGOUT / RESET</button>
  </div>

</div>

<script>
let config = {};

window.onload = function(){
  const saved = localStorage.getItem("movieplus_admin_login");
  if(saved){
    config = JSON.parse(saved);
    showAdmin();
    loadJson();
  }
};

function saveLogin(){
  config = {
    owner: owner.value.trim(),
    repo: repo.value.trim(),
    branch: branch.value.trim(),
    filePath: filePath.value.trim(),
    token: token.value.trim()
  };

  if(!config.owner || !config.repo || !config.branch || !config.filePath || !config.token){
    alert("Pakilagyan lahat ng fields.");
    return;
  }

  localStorage.setItem("movieplus_admin_login", JSON.stringify(config));
  showAdmin();
  loadJson();
}

function showAdmin(){
  loginBox.style.display = "none";
  adminBox.style.display = "block";
}

function logout(){
  localStorage.removeItem("movieplus_admin_login");
  localStorage.removeItem("github_file_sha");
  location.reload();
}

async function loadJson(){
  try{
    const apiUrl = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.filePath}?ref=${config.branch}`;

    const res = await fetch(apiUrl,{
      headers:{
        "Authorization":"Bearer " + config.token,
        "Accept":"application/vnd.github+json"
      }
    });

    const file = await res.json();

    if(!res.ok){
      alert("Load Error: " + file.message);
      return;
    }

    const jsonText = decodeURIComponent(escape(atob(file.content.replace(/\n/g,""))));
    const data = JSON.parse(jsonText);

    version_code.value = data.version_code || "";
    title.value = data.title || "";
    message.value = data.message || "";
    update_url.value = data.update_url || "";
    force_update.value = String(data.force_update || false);

    localStorage.setItem("github_file_sha", file.sha);

  }catch(e){
    alert("Load Failed: " + e.message);
  }
}

async function saveJson(){
  try{
    const sha = localStorage.getItem("github_file_sha");

    const newJson = {
      version_code: Number(version_code.value),
      title: title.value,
      message: message.value,
      update_url: update_url.value,
      force_update: force_update.value === "true"
    };

    const content = btoa(unescape(encodeURIComponent(JSON.stringify(newJson, null, 2))));

    const apiUrl = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.filePath}`;

    const res = await fetch(apiUrl,{
      method:"PUT",
      headers:{
        "Authorization":"Bearer " + config.token,
        "Accept":"application/vnd.github+json",
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:"Update version.json",
        content:content,
        sha:sha,
        branch:config.branch
      })
    });

    const result = await res.json();

    if(!res.ok){
      alert("Save Error: " + result.message);
      return;
    }

    localStorage.setItem("github_file_sha", result.content.sha);
    alert("JSON Updated Successfully!");

  }catch(e){
    alert("Save Failed: " + e.message);
  }
}
</script>

</body>
</html>
